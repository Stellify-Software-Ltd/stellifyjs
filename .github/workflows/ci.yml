name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (includes manifest generation)
        run: npm run build

      - name: Check manifest is up to date
        run: |
          if ! git diff --exit-code dist/framework-api.json; then
            echo ""
            echo "ERROR: dist/framework-api.json is out of date!"
            echo "Please run 'npm run build' and commit the updated manifest."
            exit 1
          fi

      - name: Run tests
        run: npm test
